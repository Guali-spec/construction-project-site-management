name: app
description: "A new Flutter project."
publish_to: 'none' # projet prive

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

  # Icones iOS
  cupertino_icons: ^1.0.8

  # HTTP client + routing + state
  dio: ^5.7.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1

  # Secure storage
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/buildtrack-logo.svg
