services:
  db:
    image: postgres:16
    container_name: cpsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cpsm_dev
    ports:
      - "5432:5432"
    volumes:
      - cpsm_pgdata:/var/lib/postgresql/data

volumes:
  cpsm_pgdata:
